plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"cyberblock" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
	runs {
		// dev client: a fixed window size so the camera/projection maths is easy to check
		client {
			programArgs "--width", "1920", "--height", "1080"
			// a void world needs little heap; uncapped, the client grew to 4.4 GB of commit next to Cyberpunk
			vmArgs "--enable-native-access=ALL-UNNAMED", "-Xmx2G", "-XX:+UseZGC"
			// a test client beside the real game: gradlew runClient -Pcyberblock.port=25702 "-Pcyberblock.frame=Local\CyberblockFrameTestM"
			// (-Pcyberblock.autostart=true opens the Night City world from the title screen, as the launcher profile does)
			["cyberblock.port", "cyberblock.frame", "cyberblock.autostart"].each { if (project.hasProperty(it)) vmArg "-D${it}=${project.property(it)}" }
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// WebSocket server the host game's script connects to (FiveM NUI can only speak WebSocket/HTTP)
	implementation "org.java-websocket:Java-WebSocket:1.6.0"
	include "org.java-websocket:Java-WebSocket:1.6.0"
	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// the client classes under test that do not need a running game (HostState)
sourceSets {
	test {
		compileClasspath += sourceSets.client.output
		runtimeClasspath += sourceSets.client.output
	}
}

test {
	useJUnitPlatform()
}

// the licence and credits travel inside the mod jar (plan retest3 M5); a file the repository does not have yet is skipped
jar {
	from(files("../LICENSE", "../NOTICE.md", "../THIRD-PARTY-NOTICES.md").filter { it.exists() })
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
