# Cyberblock test server template (plan 2026-10-04 section 1.15, task 1-T2). Used by `tools/mpcheck.py` and by the
# `runServer` Gradle task (task 1-L1); the real Apex server uses its own server.properties, never this file.
# Local only: it is offline-mode (offline names CbHost1, CbHost2, CbGuest1, CbGuest2), so it must never listen
# on anything but the loopback address.
online-mode=false
server-ip=127.0.0.1
# a dedicated Cyberblock server needs a whitelist (section 1.6); the harness writes whitelist.json for the four offline names
white-list=true
enforce-whitelist=true
# the host moves its player every frame, so Steve hovers: without this the server kicks him for flying
allow-flight=true
# a small, quiet, fast world: Cyberblock's own void world type (the dedicated server refuses hosts on any other, WorldCheck)
level-type=cyberblock\:nightcity
generate-structures=false
spawn-monsters=false
spawn-animals=false
spawn-npcs=false
difficulty=peaceful
spawn-protection=0
max-players=4
view-distance=6
simulation-distance=6
pause-when-empty-seconds=-1
sync-chunk-writes=false
enable-command-block=false
motd=Cyberblock test server (local only)
# the harness adds server-port, enable-rcon, rcon.port and a random rcon.password for each run (never kept in the repo)
