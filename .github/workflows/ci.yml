# Cyberblock CI: builds and tests every part on GitHub's Windows runners. Nothing here needs a Cyberpunk 2077 or Minecraft
# installation: the tests use fake game folders and the dev tools, and the mod builds from Fabric Loom's own downloads.
#
# Not run here (needs the real game): `uv run python cp/scripts/compile_check.py`, which compiles the redscript against the
# installed game's scripts. It is a local release gate: run it before tagging.
#
# The package job builds the release zip on every run; the zip is uploaded as a workflow artifact only for a version tag
# (v*). Turning it into a GitHub release is a manual step.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tools, protocol and installer tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # the licence files of third_party/ are compared with THIRD-PARTY-NOTICES.md
      - uses: astral-sh/setup-uv@v5
      - name: Install the locked dependencies
        run: uv sync --locked
      - name: Tests
        run: uv run pytest -q
      - name: shared/vectors.json is regenerated byte for byte
        run: |
          uv run python -m tools.gen_vectors
          git diff --exit-code shared/vectors.json

  mod:
    name: Minecraft mod
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        working-directory: mc
        shell: cmd
        run: gradlew.bat test build
      - uses: actions/upload-artifact@v4
        with:
          name: cyberblock-mod
          path: |
            mc/build/libs/cyberblock-*.jar
            !mc/build/libs/*-sources.jar
          if-no-files-found: error

  dll:
    name: Cyberblock.dll
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # RED4ext.SDK and ReShade's headers; not recursive
      - name: Configure
        run: cmake -S cp/plugin -B cp/plugin/build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build cp/plugin/build --config Release
      - name: Unit tests
        run: .\cp\plugin\build\Release\cb_tests.exe
      - name: "Shader compile check (ctest, fx_check)"
        run: ctest --test-dir cp/plugin/build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: cyberblock-dll
          path: cp/plugin/build/Release/Cyberblock.dll
          if-no-files-found: error

  package:
    name: Release zip
    needs: [mod, dll]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: cyberblock-dll
          path: cp/plugin/build/Release
      - uses: actions/download-artifact@v4
        with:
          name: cyberblock-mod
          path: mc/build/libs
      - name: Build the zip
        run: uv run python -m tools.package
      - name: Upload the zip (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Cyberblock-release
          path: dist/Cyberblock-*.zip
          if-no-files-found: error
